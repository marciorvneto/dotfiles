# ── Terminal / colors ────────────────────────────────────────────────
# tmux-256color supports italics; RGB enables truecolor for the outer
# terminal (Windows Terminal reports xterm-256color).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
# Undercurl + colored underlines (LSP diagnostics in nvim)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -s escape-time 0
set -g focus-events on          # lets nvim's autoread / FocusGained work
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Keys ─────────────────────────────────────────────────────────────
unbind C-b
set-option -g prefix M-w
bind-key M-w send-prefix

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -n C-a previous-window
bind -n C-g next-window

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── Look (Catppuccin Mocha, transparent) ─────────────────────────────
# Panes keep the terminal's own background, so transparency/images show.
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'
set -g pane-border-lines heavy

set -g message-style 'bg=#313244 fg=#cdd6f4'
set -g mode-style 'bg=#45475a fg=#cdd6f4'

set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=default fg=#a6adc8'
set -g status-left-length 40
set -g status-right-length 60

set -g status-left '#[bg=#cba6f7,fg=#11111b,bold] #S #[bg=default] #{?client_prefix,#[fg=#f38ba8]● ,}'
set -g status-right '#[fg=#6c7086]%H:%M '

setw -g window-status-format '#[fg=#6c7086] #I #W '
setw -g window-status-current-format '#[bg=#313244,fg=#fab387,bold] #I #[fg=#cdd6f4]#W#{?window_zoomed_flag, [Z],} '
setw -g window-status-separator ''
